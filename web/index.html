<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吃了吗</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<!-- 加到主屏幕像个小 App：自己的图标和名字；不写 start_url，从哪个地址加的就从哪儿开（远程版带着暗号的那条） -->
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="吃了吗">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<style>
/* 颜色只在这儿：纸色，跟着系统深浅走。重点色只有一个（--maple），换色改这两行。 */
:root{
  --bg:#f4f1ec; --card:#fffdfa; --card2:#faf7f1;
  --ink:#2b2724; --sub:#6e665f; --hint:#b3aaa2; --line:#e4ded6;
  --maple:#a84b33; --maple-soft:#f2e3dc; --on-maple:#fff;
  --r:16px; --shadow:0 1px 2px rgba(43,39,36,.06), 0 6px 18px -8px rgba(43,39,36,.18);
  --e-out:cubic-bezier(.22,.61,.36,1); --e-in:cubic-bezier(.4,0,1,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    /* 同一张纸的夜里版：暖的深色，不换成冷蓝灰（1008 复查） */
    --bg:#1a1714; --card:#24201c; --card2:#1f1b17;
    --ink:#f1ebe3; --sub:#b8ab9c; --hint:#857a6e; --line:rgba(255,240,225,.10);
    --maple:#e0a373; --maple-soft:rgba(224,163,115,.15); --on-maple:#2b2724;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.32);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--bg)}
@media (min-width:600px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }

/* 一页 ＝ 一张 .sub；记一笔那页从右边滑进来盖在上面 */
.sub{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s var(--e-in)}
.sub.on{transform:none;transition:transform .3s var(--e-out)}
#foodpage{transform:none}
/* 1008 交互专查：上下两页同色，盖上来看不出边 —— 盖着的那张带一道阴影 */
.sub.on:not(#foodpage){box-shadow:-12px 0 32px rgba(0,0,0,.10)}
#foodnew.on,#foodcities.on{box-shadow:0 -12px 32px rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){ .sub.on:not(#foodpage){box-shadow:-12px 0 32px rgba(0,0,0,.45)} #foodnew.on,#foodcities.on{box-shadow:0 -12px 32px rgba(0,0,0,.5)} }
.top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px}
.iconbtn{width:44px;height:44px;flex:none;border:0;border-radius:12px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .16s}
.iconbtn:active{transform:scale(.92)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 顶上的标题：就是一行字，不做成像按钮、像搜索框的胶囊（1008 复查） */
.stamp{flex:1;display:flex;align-items:center;justify-content:center;
  padding:9px 12px;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden}
.subwrap{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(30px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-size:10.5px;font-weight:400;letter-spacing:.17em;color:var(--sub);text-transform:uppercase;margin:8px 2px 10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px 12px;margin:0 -16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:12.5px;padding:6px 13px;
  border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s var(--e-out),color .2s var(--e-out)}
.chip.on{background:var(--maple);border-color:var(--maple);color:var(--on-maple)}
.chips.chips2 .chip{font-size:12px;padding:5px 11px}
.chips.chips2 .chip.on{background:var(--maple-soft);border-color:transparent;color:var(--maple);font-weight:600}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px}
.stat .k{font-size:11px;letter-spacing:.12em;color:var(--hint)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .n{font-size:13px;color:var(--sub)}

/* 一件件到位：往左 14px 淡进来，48ms 一档 */
.m6in{animation:m6in .26s var(--e-out) backwards;animation-delay:var(--m6d,0ms)}
@keyframes m6in{from{opacity:0;transform:translateX(14px)}}
@media (prefers-reduced-motion: reduce){ .m6in{animation:none} .sub,.sub.on{transition:none} }

/* 提示：在拇指那一带、底栏上面（最高的底栏 125px），深色里反过来，看得出浮在上面 */
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,6px);
  background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.18);width:max-content;text-align:center;line-height:1.45;font-size:13.5px;padding:10px 16px;border-radius:12px;max-width:80vw;
  opacity:0;pointer-events:none;transition:opacity .2s var(--e-out),transform .2s var(--e-out);z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<!-- 默认露着这句：直接双击文件打开、或者脚本没跑起来，看到的都是它，不是一张白纸。从本机服务打开时脚本把它收起来 -->
<div id="nofile" style="max-width:420px;margin:18vh auto 0;padding:0 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.9">
  <div style="font-size:20px;color:var(--ink);font-weight:600;margin-bottom:10px">吃了吗</div>
  这一页要从本机服务打开。<br>
  回到这个文件夹，双击 <b style="color:var(--ink)">run.command</b>（Windows 是 <b style="color:var(--ink)">run.bat</b>），<br>
  浏览器会自己打开 http://127.0.0.1:8770 。<br>
  装了一键安装包的，Claude 桌面 App 开着时直接打开那个地址就行。
</div>
<script>
(function(){
  var t = document.getElementById('toast'), h;
  window.toast = function (m) { t.textContent = m; t.classList.add('on'); clearTimeout(h); h = setTimeout(function(){ t.classList.remove('on'); }, 3000); };
  if (/^https?:$/.test(location.protocol)) {
    document.getElementById('nofile').hidden = true;
    document.getElementById('app').hidden = false;
    window.FOOD_STANDALONE = true;   // 告诉 app.js：这是单独开的一页，不是挂在别人家里
    var s = document.createElement('script'); s.src = '/app.js'; document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
